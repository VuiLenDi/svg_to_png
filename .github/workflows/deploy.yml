name: Deploy static site to AWS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          if-no-files-found: error

  terraform-plan:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment variables
        run: |
          test -n "$TF_VAR_domain_name" || { echo "::error::Set the DOMAIN_NAME repository variable"; exit 1; }
          test -n "$TF_VAR_acm_certificate_arn" || { echo "::error::Set the ACM_CERTIFICATE_ARN repository variable"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_PLAN_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.5

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-color

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment variables
        run: |
          test -n "$TF_VAR_domain_name" || { echo "::error::Set the DOMAIN_NAME repository variable"; exit 1; }
          test -n "$TF_VAR_acm_certificate_arn" || { echo "::error::Set the ACM_CERTIFICATE_ARN repository variable"; exit 1; }

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.5

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Apply infrastructure
        working-directory: terraform
        run: terraform apply -auto-approve -no-color

      - name: Upload site to S3
        working-directory: terraform
        run: aws s3 sync ../dist/ "s3://$(terraform output -raw site_bucket_name)" --delete

      - name: Invalidate CloudFront cache
        working-directory: terraform
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform output -raw cloudfront_distribution_id)" \
            --paths "/*"
